name: Daily feedback draft PR

on:
  schedule:
    # 00:00 Asia/Ho_Chi_Minh (UTC+7). GitHub Actions schedules use UTC.
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: daily-feedback-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve report date
        id: date
        shell: bash
        run: echo "report_date=$(TZ=Asia/Ho_Chi_Minh date +%F)" >> "$GITHUB_OUTPUT"

      - name: Skip an already-open report PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
        shell: bash
        run: |
          branch="automation/daily-feedback-${REPORT_DATE}"
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An open draft PR already exists for ${REPORT_DATE}; nothing to do."
          elif gh auth setup-git && git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A branch already exists for ${REPORT_DATE}; refusing to overwrite it."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect feedback issues
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --label skill-feedback \
            --limit 500 \
            --json number,title,body,url,createdAt,updatedAt,labels \
            > "$RUNNER_TEMP/skill-feedback-issues.json"

      - name: Build the daily summary
        id: summary
        if: steps.existing.outputs.skip != 'true'
        env:
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
        shell: bash
        run: |
          node --experimental-strip-types scripts/feedback/create-daily-summary.ts \
            --issues "$RUNNER_TEMP/skill-feedback-issues.json" \
            --output "plans/feedback/daily/${REPORT_DATE}.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create a draft PR
        if: steps.existing.outputs.skip != 'true' && steps.summary.outputs.has_new_material == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
        shell: bash
        run: |
          branch="automation/daily-feedback-${REPORT_DATE}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "plans/feedback/daily/${REPORT_DATE}.md"
          git commit -m "chore(feedback): summarize ${REPORT_DATE}"
          # Checkout credentials are intentionally disabled; configure the token-backed Git helper before pushing.
          gh auth setup-git
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --draft \
            --title "chore(feedback): daily summary ${REPORT_DATE}" \
            --body "Daily sanitized Squad feedback summary for ${REPORT_DATE}. Review the report before merging; this workflow never merges or edits main."
