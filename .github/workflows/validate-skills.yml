name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main
  # Link rot is third-party state, not a property of any one change. Checking it
  # on a cadence the maintainer owns means a vendor reorganizing its docs is
  # reported to the person who can fix it, instead of failing the next unrelated
  # pull request. 02:00 UTC Monday.
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  validate:
    # The scheduled run exists only for source liveness; re-running the offline
    # gate on a repository nobody has touched proves nothing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate catalog and package release
        run: pnpm release:check

  # Reports a knowledge card whose source has moved or gone. Kept out of the
  # gate above because it depends on third-party hosts: a slow documentation
  # site must not fail a contributor's pull request, and `pnpm test` stays
  # offline and deterministic. It reads status codes only and never a body.
  #
  # The same job serves two audiences, so its failure mode depends on the event.
  # On a pull request it only reports, and a dead source never blocks a
  # contributor whose change had nothing to do with it. On the weekly schedule it
  # is allowed to fail, because a green run nobody is notified about is the same
  # as not checking at all.
  knowledge-sources:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report knowledge-card source liveness
        run: pnpm evals:links
