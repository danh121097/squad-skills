name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main
  # Link rot is third-party state, not a property of any one change. Checking it
  # on a cadence the maintainer owns means a vendor reorganizing its docs is
  # reported to the person who can fix it, instead of failing the next unrelated
  # pull request. 02:00 UTC Monday.
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # The scheduled and manual runs exist only for source liveness; re-running
    # the offline gate on a repository nobody has touched proves nothing.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate catalog and package release
        run: pnpm release:check

  # Tags `main` and opens the GitHub release once `package.json` carries a
  # version no tag matches. The version itself is never chosen here — it is
  # committed by hand alongside the change that earned it, and `pnpm release`
  # refuses to publish a version npm already has.
  #
  # Runs only on a push to `main`, never on a pull request: a fork's pull
  # request must not reach a job holding write permission. It uses the
  # automatic `GITHUB_TOKEN` through the runner's own `gh`, rather than a
  # third-party action, so nothing outside this repository is trusted with that
  # permission, and it writes no commit — only a tag and a release.
  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Read the version from package.json
        id: version
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the tag and GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --generate-notes

  # Reports a source-registry link that has moved or gone. Kept out of the
  # gate above because it depends on third-party hosts: a slow documentation
  # site must not fail a contributor's pull request, and `pnpm test` stays
  # offline and deterministic. It reads status codes only and never a body.
  # It runs on the weekly schedule and on demand, and fails so a dead source
  # notifies the maintainer.
  source-links:
    # A pull request runs it only when it edits a source registry, so a new dead
    # link is caught by the change that adds it and unrelated changes stay quiet.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect source-registry changes
        id: registries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] ||
            ! git diff --quiet "$BASE_SHA" HEAD -- 'skills/*/references/official-sources.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.registries.outputs.changed == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        if: steps.registries.outputs.changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.registries.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Report source-registry liveness
        if: steps.registries.outputs.changed == 'true'
        run: pnpm check:links
