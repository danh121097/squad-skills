# Transcribed from the platform and source routers in
# skills/squad-designer/SKILL.md. Each task type names the references a run of
# that type loads; loaded_words is entrypoint_words plus those references.
#
# Phase 3 routing changes, each tied to a consolidation, reviewed as this diff:
# - ui-foundation-and-motion-selection.md is now platform-web-foundations-and-motion.md
#   and loads only when web foundation, framework, motion, or OpenUI selection
#   is in play — not for every web task.
# - design-mindset-evaluation-and-official-sources.md merged: its evaluation
#   passes into the handoff reference (accessibility-audit now loads one file),
#   its source lists into official-sources.md.
# - runtime-capability-fallbacks.md merged into official-sources.md, which
#   degraded-runtime-fallback now loads instead of two files.
# - Research-driven tasks additionally load official-sources.md because the
#   research protocol now draws its source set from the registry.
# - Native and design-system task types also load official-sources.md: their
#   platform references cite official docs, HIG, and Material 3 through the
#   registry, and the registry's own entries apply to design-system work.
# - Native and adaptive task types are new with the platform expansion.
#
# Later routing edit, reviewed as its own diff: design-system-tokens now loads
# anti-slop-quality-review.md. Its "System coherence" checks are token, anatomy,
# variant, radius, border, shadow, icon, and state rules — token work is exactly
# what they govern, and tokens are the foundation every later screen inherits.
# The entrypoint condition reads "material UI/design-system work" to match.
# adaptive-split-view was considered and rejected: it is the lightest task type,
# so loading anti-slop there would raise the median past the phase_1_reference
# ceiling, and adapting an existing system to a size class is layout and input
# work, not visual direction.
