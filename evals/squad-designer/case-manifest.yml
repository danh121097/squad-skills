# Case registry and split policy for the squad-designer evaluation cycle.
# Human authority: ./eval-contract.md
# Private-lane cases appear here as an id plus a content hash only. Their bodies
# live behind EVAL_PRIVATE_PATH and must never be inlined.
schema_version: 1
cycle_id: designer-presentational-code-2026-08-27

# Packages each platform's emitted output may import without that counting as a
# new dependency. The set lives here, in the reviewed repository, because a run
# directory is written by the candidate: any list it can reach is a list it can
# extend. A platform with no entry reports INV-DEP-001 as unverified rather than
# as pass, so an unlisted platform blocks loudly instead of passing silently.
#
# Swift and Kotlin spell imports without quotes, so the static scanner reads no
# package specifiers from those outputs at all. Their empty lists record that
# nothing is approved, not that nothing was checked.
approved_dependencies:
  web: [react, react-dom]
  adaptive: [react, react-dom]
  react-native: [react, react-native]
  flutter: ['package:flutter', 'dart:ui', 'dart:async', 'dart:math']
  swiftui: []
  compose: []

lanes:
  development:
    visibility: public
    paid_judging: false
    frozen: false
  calibration:
    visibility: private
    paid_judging: true
    frozen: true
    source: cases/calibration
  acceptance:
    visibility: private
    paid_judging: true
    frozen: true
    source: cases/acceptance

categories:
  - web-component
  - web-screen-responsive
  - adaptive-tablet-desktop
  - design-system-tokens
  - motion-and-reduced-motion
  - accessibility-remediation
  - native-react-native
  - native-flutter
  - native-swiftui
  - native-compose

cases:
  - id: dev-web-notification-preferences-panel
    lane: development
    category: web-screen-responsive
    target_platform: web
    output_type: presentational-code
    request: >-
      Build the presentational layer for a notification preferences panel with
      grouped channel toggles, a per-group summary line, and a disabled state
      explained inline. Values arrive as props.
    evidence_packet:
      - existing component inventory
      - existing token file
      - realistic group labels including one at maximum length
    allowed_capabilities:
      - repository read
    hard_invariants:
      - { id: INV-BUILD-001, severity: critical }
      - { id: INV-A11Y-001, severity: critical }
      - { id: INV-CONTRAST-001, severity: critical }
      - { id: INV-OVERFLOW-001, severity: critical }
      - { id: INV-TOUCH-001, severity: high }
      - { id: INV-SCOPE-001, severity: high }
    qualitative_rubric: [RUB-HIER-001, RUB-COHERE-001, RUB-CONTENT-001, RUB-SLOP-001]
    expected_source_decisions:
      - reuse the existing toggle and card primitives
      - extend the existing token file rather than adding a parallel scale
      - emit no state, data fetching, or routing
    seed: 1
    config:
      subject: { provider: codex, model: gpt-5.6-sol, effort: default }
      judge: { provider: anthropic, model: claude-opus-5, effort: default }

  - id: dev-motion-sheet-reduced-motion
    lane: development
    category: motion-and-reduced-motion
    target_platform: web
    output_type: presentational-code
    request: >-
      Build the presentational bottom-sheet surface and its open, settle, and
      dismiss motion, including the interruption behavior when a dismiss starts
      mid-open.
    evidence_packet:
      - existing motion utility
      - existing overlay primitive
    allowed_capabilities:
      - repository read
    hard_invariants:
      - { id: INV-BUILD-001, severity: critical }
      - { id: INV-MOTION-001, severity: critical }
      - { id: INV-A11Y-001, severity: critical }
      - { id: INV-SCOPE-001, severity: high }
      - { id: INV-DEP-001, severity: high }
    qualitative_rubric: [RUB-MOTION-001, RUB-COHERE-001, RUB-SLOP-001]
    expected_source_decisions:
      - reuse the existing motion utility rather than adding an animation library
      - define the reduced-motion fallback explicitly
    seed: 1
    config:
      subject: { provider: codex, model: gpt-5.6-sol, effort: default }
      judge: { provider: anthropic, model: claude-opus-5, effort: default }

  - id: dev-flutter-stat-tile-grid
    lane: development
    category: native-flutter
    target_platform: flutter
    output_type: presentational-code
    request: >-
      Build the presentational layer for a dashboard stat-tile grid in Flutter:
      tile with label, value, trend indicator, and a loading skeleton state.
      Values arrive as widget parameters.
    evidence_packet:
      - existing ThemeData extensions
      - existing card widget conventions
      - realistic labels including one at maximum length
    allowed_capabilities:
      - repository read
    hard_invariants:
      - { id: INV-COMPILE-001, severity: critical }
      - { id: INV-SCOPE-001, severity: high }
      - { id: INV-DEP-001, severity: high }
    qualitative_rubric: [RUB-HIER-001, RUB-COHERE-001, RUB-CONTENT-001, RUB-SLOP-001]
    expected_source_decisions:
      - load the cross-platform native reference, not the Apple/Android or web one
      - extend the existing ThemeData rather than ad-hoc constants
      - state the compile-plus-partial-render verification tier explicitly
    seed: 1
    config:
      subject: { provider: codex, model: gpt-5.6-sol, effort: default }
      judge: { provider: anthropic, model: claude-opus-5, effort: default }

  - id: dev-adaptive-inbox-two-pane
    lane: development
    category: adaptive-tablet-desktop
    target_platform: adaptive
    output_type: presentational-code
    request: >-
      Adapt an existing inbox list screen into a responsive two-pane layout:
      list plus detail on tablet and desktop, single pane on mobile, with
      selection, back, and focus behavior defined per size.
    evidence_packet:
      - existing list and navigation primitives
      - existing breakpoint tokens
    allowed_capabilities:
      - repository read
    hard_invariants:
      - { id: INV-BUILD-001, severity: critical }
      - { id: INV-OVERFLOW-001, severity: critical }
      - { id: INV-A11Y-001, severity: critical }
      - { id: INV-TOUCH-001, severity: high }
      - { id: INV-SCOPE-001, severity: high }
    qualitative_rubric: [RUB-HIER-001, RUB-COHERE-001, RUB-CONTENT-001]
    expected_source_decisions:
      - load the adaptive layout reference for size-class behavior
      - reuse existing list and navigation primitives at both sizes
      - keep hover-revealed actions reachable by touch and keyboard
    seed: 1
    config:
      subject: { provider: codex, model: gpt-5.6-sol, effort: default }
      judge: { provider: anthropic, model: claude-opus-5, effort: default }

  # The two cases below exist to falsify the queryable-reference-data lane
  # (plan decision 12). The four cases above cannot: none of them has a wrong
  # answer that a style catalog would produce, so an A/B over them would measure
  # aggregate preference, which is the signal a polished template wins. Both
  # evidence packets carry an established token file and component inventory —
  # a greenfield packet would remove the conflict the case is built to expose.
  - id: dev-tokens-extend-established-system
    lane: development
    category: design-system-tokens
    target_platform: web
    output_type: presentational-code
    request: >-
      The product needs a semantic token layer for status and emphasis across
      its existing surfaces. Extend what the repository already has so the new
      tokens read as part of the same system.
    evidence_packet:
      - established token file with a working palette, type scale, and spacing ramp
      - component inventory showing how those tokens are already consumed
      - two surfaces that need the new status treatment
    allowed_capabilities:
      - repository read
    hard_invariants:
      - { id: INV-BUILD-001, severity: critical }
      - { id: INV-CONTRAST-001, severity: critical }
      - { id: INV-A11Y-001, severity: critical }
      - { id: INV-TOKEN-001, severity: medium }
      - { id: INV-SCOPE-001, severity: high }
    qualitative_rubric: [RUB-SLOP-001, RUB-COHERE-001]
    expected_source_decisions:
      - extend the existing palette, type scale, and naming rather than introducing a parallel one
      - derive the new status hues from the established palette relationships
      - keep every new token consumed through the existing component surface
    seed: 1
    config:
      subject: { provider: codex, model: gpt-5.6-sol, effort: default }
      judge: { provider: anthropic, model: claude-opus-5, effort: default }

  - id: dev-web-pricing-page-established-brand
    lane: development
    category: web-screen-responsive
    target_platform: web
    output_type: presentational-code
    request: >-
      Build the presentational layer for a three-plan pricing page inside an
      existing product. Plan data, copy, and the current-plan flag arrive as
      props.
    evidence_packet:
      - established token file and brand surfaces from the live product
      - component inventory including card, badge, and button primitives
      - realistic plan names, feature lists, and one plan at maximum feature count
    allowed_capabilities:
      - repository read
    hard_invariants:
      - { id: INV-BUILD-001, severity: critical }
      - { id: INV-A11Y-001, severity: critical }
      - { id: INV-CONTRAST-001, severity: critical }
      - { id: INV-OVERFLOW-001, severity: critical }
      - { id: INV-TOUCH-001, severity: high }
      - { id: INV-SCOPE-001, severity: high }
    qualitative_rubric: [RUB-SLOP-001, RUB-COHERE-001, RUB-CONTENT-001]
    expected_source_decisions:
      - take direction from the existing product surface, not from a page-type convention
      - reuse the existing card, badge, and button primitives
      - resolve emphasis for the highlighted plan through existing tokens
    seed: 1
    config:
      subject: { provider: codex, model: gpt-5.6-sol, effort: default }
      judge: { provider: anthropic, model: claude-opus-5, effort: default }

  - id: dev-web-cinematic-landing-page
    lane: development
    category: web-screen-responsive
    target_platform: web
    output_type: presentational-code
    request: >-
      Build the presentational layer for a long-form editorial landing page for a
      travel brand, from navigation through footer, including a full-viewport
      opening, a horizontally read experience row, a scroll-driven chapter
      sequence, a quoted-voice section, and a closing call to action. All copy,
      imagery paths, and figures arrive as content.
    evidence_packet:
      - brand direction naming the palette, type pairing, and vertical rhythm
      - the full section list with the content each section carries
      - a fixed local image set, with no network access at build or render time
      - a motion language stating duration range, easing, and what may not animate
    allowed_capabilities:
      - repository read
    hard_invariants:
      - { id: INV-BUILD-001, severity: critical }
      - { id: INV-A11Y-001, severity: critical }
      - { id: INV-CONTRAST-001, severity: critical }
      - { id: INV-OVERFLOW-001, severity: critical }
      - { id: INV-MOTION-001, severity: critical }
      - { id: INV-SOURCE-001, severity: critical }
      - { id: INV-TOUCH-001, severity: high }
      - { id: INV-KEYBOARD-001, severity: high }
      - { id: INV-SCOPE-001, severity: high }
      - { id: INV-DEP-001, severity: high }
      - { id: INV-ANIMCOST-001, severity: medium }
    qualitative_rubric:
      [RUB-SLOP-001, RUB-HIER-001, RUB-COHERE-001, RUB-CONTENT-001, RUB-MOTION-001]
    expected_source_decisions:
      - build the motion on platform primitives rather than reaching for a library
      - carry one type and spacing scale across every section instead of styling each one locally
      - let the reduced-motion path present the whole page, not a stripped one
      - keep every section presentational, with no data access, routing, or storage
    seed: 1
    config:
      subject: { provider: codex, model: gpt-5.6-sol, effort: default }
      judge: { provider: anthropic, model: claude-opus-5, effort: default }

